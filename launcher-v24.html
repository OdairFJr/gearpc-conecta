<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a376c" />
  <title>GEArPC Conecta</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#edf3f8;color:#17324d}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3f8}
    main{width:min(92vw,420px);background:white;border-radius:18px;padding:28px 22px;text-align:center;box-shadow:0 8px 28px #0002}
    img{width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:12px}
    h1{font-size:1.35rem;margin:0 0 8px}p{margin:0;color:#5c7184;line-height:1.45}.small{margin-top:12px;font-size:.82rem}
  </style>
</head>
<body>
  <main>
    <img src="logo-grupo.jpeg" alt="Logo do GEArPC" />
    <h1>GEArPC Conecta</h1>
    <p id="status">Recuperando aplicativo…</p>
    <p class="small">Seus dados do grupo não serão apagados.</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      if (!navigator.onLine) {
        status.textContent = 'Conecte-se à internet para concluir a recuperação.';
        return;
      }

      try {
        status.textContent = 'Limpando versão travada…';
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.allSettled(regs.map((reg) => reg.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.allSettled(keys
            .filter((key) => key.startsWith('gearpc-conecta-'))
            .map((key) => caches.delete(key)));
        }

        status.textContent = 'Abrindo versão estável…';
        location.replace('./?recovery=34');
      } catch (_) {
        status.textContent = 'Abrindo versão estável…';
        location.replace('./?recovery=34');
      }
    })();
  </script>
</body>
</html>
